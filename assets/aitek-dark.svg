<svg viewBox="0 0 900 460" xmlns="http://www.w3.org/2000/svg">
  <style>
    text {
      font-family: 'Courier New', Courier, monospace;
    }

    .scene { opacity: 0; }

    @keyframes show-scene-1 {
      0%, 16.6% { opacity: 0; }
      16.7%, 25% { opacity: 1; }
      25.1%, 100% { opacity: 0; }
    }
    @keyframes show-scene-2 {
      0%, 41.6% { opacity: 0; }
      41.7%, 50% { opacity: 1; }
      50.1%, 100% { opacity: 0; }
    }
    @keyframes show-scene-3 {
      0%, 66.6% { opacity: 0; }
      66.7%, 75% { opacity: 1; }
      75.1%, 100% { opacity: 0; }
    }
    @keyframes show-scene-4 {
      0%, 91.6% { opacity: 0; }
      91.7%, 100% { opacity: 1; }
    }

    .scene-1 { animation: show-scene-1 48s step-end infinite; }
    .scene-2 { animation: show-scene-2 48s step-end infinite; }
    .scene-3 { animation: show-scene-3 48s step-end infinite; }
    .scene-4 { animation: show-scene-4 48s step-end infinite; }

    @keyframes blink {
      0%, 100% { opacity: 1; }
      50% { opacity: 0; }
    }
    .cursor-blink { animation: blink 1s step-end infinite; }

    @keyframes flash-burst {
      0%, 25% { opacity: 0; }
      30%, 55% { opacity: 1; }
      60%, 100% { opacity: 0; }
    }
    .flash { opacity: 0; animation: flash-burst 2s step-end infinite; }

    @keyframes note-pop {
      0%, 20% { opacity: 0; }
      25%, 75% { opacity: 1; }
      80%, 100% { opacity: 0; }
    }
    .note-1 { opacity: 0; animation: note-pop 4s step-end infinite; }
    .note-2 { opacity: 0; animation: note-pop 4s step-end 1.3s infinite; }
    .note-3 { opacity: 0; animation: note-pop 4s step-end 2.6s infinite; }

    @keyframes sparkle {
      0%, 45% { opacity: 1; }
      50%, 95% { opacity: 0; }
      100% { opacity: 1; }
    }
    .sparkle-1 { animation: sparkle 1.6s step-end infinite; }
    .sparkle-2 { animation: sparkle 1.6s step-end 0.4s infinite; }
    .sparkle-3 { animation: sparkle 1.6s step-end 0.8s infinite; }
    .sparkle-4 { animation: sparkle 1.6s step-end 1.2s infinite; }

    @media (prefers-reduced-motion: reduce) {
      .scene, .cursor-blink, .flash,
      .note-1, .note-2, .note-3,
      .sparkle-1, .sparkle-2, .sparkle-3, .sparkle-4 {
        animation: none !important;
      }
      .scene { opacity: 0; }
    }
  </style>

  <!-- ===== FRAME ===== -->
  <rect x="15" y="15" width="870" height="355" rx="12" ry="12"
        fill="none" stroke="#C77B5B" stroke-width="3" stroke-dasharray="8,5"/>

  <!-- Frame title -->
  <rect x="28" y="3" width="150" height="24" fill="#0d1117" rx="2"/>
  <text x="38" y="20" font-size="15" fill="#C77B5B" font-weight="bold">AItek v23.0.0</text>

  <!-- Vertical divider -->
  <line x1="363" y1="25" x2="363" y2="360" stroke="#C77B5B" stroke-width="3" stroke-dasharray="8,5"/>

  <!-- Horizontal divider (right panel) -->
  <line x1="375" y1="170" x2="873" y2="170" stroke="#C77B5B" stroke-width="2"/>

  <!-- ===== LEFT PANEL ===== -->
  <text x="189" y="55" text-anchor="middle" font-size="17" font-weight="bold" fill="#c9d1d9">let's build something cool</text>
  <text x="189" y="290" text-anchor="middle" font-size="13" fill="#8b949e">europe/poland/kalisz</text>
  <text x="189" y="348" text-anchor="middle" font-size="13" fill="#8b949e">film · music · code · magic</text>

  <!-- ===== CLAWD BASE (flat, single color, no shadows) ===== -->
  <g id="clawd-base" transform="translate(-67, 24) scale(8)" shape-rendering="crispEdges">
    <!-- Body -->
    <rect x="24" y="14" width="16" height="12" fill="#F28C42"/>
    <!-- Left ear -->
    <rect x="22" y="17" width="2" height="5" fill="#F28C42"/>
    <!-- Right ear -->
    <rect x="40" y="17" width="2" height="5" fill="#F28C42"/>
    <!-- Eyes -->
    <rect x="27" y="19" width="3" height="2" fill="#1A1A2E"/>
    <rect x="34" y="19" width="3" height="2" fill="#1A1A2E"/>
    <!-- Legs -->
    <rect x="25" y="26" width="2" height="4" fill="#F28C42"/>
    <rect x="29" y="26" width="2" height="4" fill="#F28C42"/>
    <rect x="33" y="26" width="2" height="4" fill="#F28C42"/>
    <rect x="37" y="26" width="2" height="4" fill="#F28C42"/>
  </g>

  <!-- ===== SCENE 1: CAMERA ===== -->
  <g class="scene scene-1" transform="translate(-67, 24) scale(8)" shape-rendering="crispEdges">
    <!-- Camera body -->
    <rect x="42" y="20" width="5" height="3" fill="#3A3A46"/>
    <rect x="42" y="20" width="5" height="1" fill="#4A4A58"/>
    <!-- Lens -->
    <rect x="44" y="21" width="2" height="2" fill="#1A1A2E"/>
    <!-- Viewfinder -->
    <rect x="43" y="19" width="2" height="1" fill="#3A3A46"/>
    <!-- Arm holding camera -->
    <rect x="40" y="22" width="2" height="2" fill="#F28C42"/>
    <!-- Flash lines -->
    <g class="flash">
      <rect x="49" y="18" width="2" height="1" fill="#FFFFFF"/>
      <rect x="48" y="16" width="1" height="2" fill="#FFFFFF"/>
      <rect x="50" y="17" width="1" height="2" fill="#FFFFFF"/>
      <rect x="51" y="19" width="1" height="1" fill="#FFFFFF"/>
    </g>
  </g>

  <!-- ===== SCENE 2: HEADPHONES ===== -->
  <g class="scene scene-2" transform="translate(-67, 24) scale(8)" shape-rendering="crispEdges">
    <!-- Band -->
    <rect x="26" y="12" width="12" height="1" fill="#2D2D36"/>
    <rect x="22" y="13" width="20" height="1" fill="#2D2D36"/>
    <!-- Left ear cup -->
    <rect x="20" y="14" width="4" height="8" fill="#3A3A46"/>
    <rect x="21" y="15" width="2" height="6" fill="#4A4A58"/>
    <!-- Right ear cup -->
    <rect x="40" y="14" width="4" height="8" fill="#3A3A46"/>
    <rect x="41" y="15" width="2" height="6" fill="#4A4A58"/>
    <!-- Music notes -->
    <g class="note-1">
      <rect x="46" y="12" width="1" height="3" fill="#8A2BE2"/>
      <rect x="45" y="14" width="2" height="1" fill="#8A2BE2"/>
    </g>
    <g class="note-2">
      <rect x="49" y="9" width="1" height="3" fill="#8A2BE2"/>
      <rect x="48" y="11" width="2" height="1" fill="#8A2BE2"/>
    </g>
    <g class="note-3">
      <rect x="18" y="10" width="1" height="3" fill="#8A2BE2"/>
      <rect x="17" y="12" width="2" height="1" fill="#8A2BE2"/>
    </g>
  </g>

  <!-- ===== SCENE 3: MAGIC HAT ===== -->
  <g class="scene scene-3" transform="translate(-67, 24) scale(8)" shape-rendering="crispEdges">
    <!-- Hat brim -->
    <rect x="24" y="13" width="16" height="2" fill="#1A1A2E"/>
    <!-- Hat body -->
    <rect x="27" y="6" width="10" height="7" fill="#1A1A2E"/>
    <!-- Hat band -->
    <rect x="27" y="11" width="10" height="2" fill="#8A2BE2"/>
    <!-- Sparkles -->
    <g class="sparkle-1">
      <rect x="20" y="6" width="1" height="3" fill="#FFFFFF"/>
      <rect x="19" y="7" width="3" height="1" fill="#FFFFFF"/>
    </g>
    <g class="sparkle-2">
      <rect x="44" y="8" width="1" height="3" fill="#8A2BE2"/>
      <rect x="43" y="9" width="3" height="1" fill="#8A2BE2"/>
    </g>
    <g class="sparkle-3">
      <rect x="22" y="5" width="1" height="2" fill="#8A2BE2"/>
      <rect x="21" y="6" width="3" height="1" fill="#8A2BE2"/>
    </g>
    <g class="sparkle-4">
      <rect x="41" y="5" width="1" height="2" fill="#FFFFFF"/>
      <rect x="40" y="6" width="3" height="1" fill="#FFFFFF"/>
    </g>
  </g>

  <!-- ===== SCENE 4: LAPTOP ===== -->
  <g class="scene scene-4" transform="translate(-67, 24) scale(8)" shape-rendering="crispEdges">
    <!-- Laptop screen -->
    <rect x="25" y="26" width="14" height="9" fill="#2D2D36"/>
    <rect x="26" y="27" width="12" height="7" fill="#1A1A2E"/>
    <!-- Code lines -->
    <rect x="27" y="28" width="5" height="1" fill="#8A2BE2"/>
    <rect x="33" y="28" width="3" height="1" fill="#4CAF50"/>
    <rect x="27" y="30" width="3" height="1" fill="#C77B5B"/>
    <rect x="31" y="30" width="6" height="1" fill="#8A2BE2"/>
    <rect x="27" y="32" width="7" height="1" fill="#4CAF50"/>
    <!-- Laptop base -->
    <rect x="24" y="35" width="16" height="2" fill="#3A3A46"/>
    <rect x="24" y="35" width="16" height="1" fill="#4A4A58"/>
  </g>

  <!-- ===== RIGHT PANEL ===== -->

  <!-- Parameters -->
  <text x="385" y="55" font-size="14" font-weight="bold" fill="#C77B5B">Parameters</text>

  <text x="385" y="85" font-size="14" fill="#8b949e">temperature</text>
  <text x="860" y="85" font-size="14" fill="#8A2BE2" text-anchor="end">0.97</text>

  <text x="385" y="112" font-size="14" fill="#8b949e">extended_thinking</text>
  <text x="860" y="112" font-size="14" fill="#8A2BE2" text-anchor="end">enabled</text>

  <text x="385" y="139" font-size="14" fill="#8b949e">tools</text>
  <text x="860" y="139" font-size="14" fill="#c9d1d9" text-anchor="end">Claude · Gemini · Cursor</text>

  <!-- Dependencies -->
  <text x="385" y="200" font-size="14" font-weight="bold" fill="#C77B5B">Dependencies</text>
  <text x="385" y="228" font-size="14" fill="#c9d1d9">["coffee", "spotify", "good vibes", "wifi"]</text>

  <!-- Blinking cursor -->
  <rect class="cursor-blink" x="752" y="215" width="8" height="15" fill="#8A2BE2" rx="1"/>

  <!-- ===== STATS (below frame) ===== -->
  <text x="30" y="400" font-size="14" fill="#8b949e">total_commits</text>
  <text x="420" y="400" font-size="14" fill="#8A2BE2" text-anchor="end">847</text>

  <text x="470" y="400" font-size="14" fill="#8b949e">current_streak</text>
  <text x="860" y="400" font-size="14" fill="#8A2BE2" text-anchor="end">12 days</text>

  <text x="30" y="428" font-size="14" fill="#8b949e">total_repos</text>
  <text x="420" y="428" font-size="14" fill="#8A2BE2" text-anchor="end">23</text>

  <text x="470" y="428" font-size="14" fill="#8b949e">languages</text>
  <text x="860" y="428" font-size="14" fill="#c9d1d9" text-anchor="end">TypeScript · Python · JavaScript</text>

</svg>
